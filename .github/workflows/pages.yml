name: Deploy site

# Builds the static site from a GTFS feed and publishes it to GitHub Pages.
#
# The feed is not stored in this repository. To enable deployment:
#   1. Confirm you may redistribute derived data (see NOTICE).
#   2. Set the repository variable FEED_URL to a DIRECT download link to the GTFS .zip
#      (a link that returns the zip itself, not a web page that previews it).
#   3. Settings -> Pages -> Source: "GitHub Actions".
# Without FEED_URL the job is skipped.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly, picks up a refreshed feed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.FEED_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download the feed
        env:
          FEED_URL: ${{ vars.FEED_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          curl -fsSL "$FEED_URL" -o "$RUNNER_TEMP/feed.zip"
          # Hosts like Google Drive answer with an HTML page instead of the file
          # when the link is not a direct download; fail with a clear message.
          if ! unzip -tq "$RUNNER_TEMP/feed.zip" >/dev/null 2>&1; then
            echo "::error::FEED_URL did not return a zip file. It must be a direct download link."
            exit 1
          fi
          unzip -q -j "$RUNNER_TEMP/feed.zip" '*.txt' -d "$RUNNER_TEMP/feed"
          for f in routes trips stops stop_times shapes; do
            test -f "$RUNNER_TEMP/feed/$f.txt" || { echo "::error::feed is missing $f.txt"; exit 1; }
          done
      - name: Build the site
        run: go run ./cmd/tgbus build -feed "$RUNNER_TEMP/feed" -out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deployment is a separate job (GitHub's documented pattern) so the uploaded
  # artifact is registered before deploy-pages looks it up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
