name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet the WebAssembly build
        run: GOOS=js GOARCH=wasm go vet ./cmd/planner-wasm
      - name: Test
        run: go test -race ./...
      - name: Build the site from the fixture feed
        run: go run ./cmd/tgbus build -feed testdata/feed -out "$RUNNER_TEMP/site" && test -f "$RUNNER_TEMP/site/index.html"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Build the site and the planner (WebAssembly) from the fixture feed
        run: make site FEED=testdata/feed OUT="$RUNNER_TEMP/site"
      - name: Unit tests, including the planner running as WebAssembly
        env:
          TGBUS_DIST: ${{ runner.temp }}/site
        run: node --test web/test/*.test.mjs
