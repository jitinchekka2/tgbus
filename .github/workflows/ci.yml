name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build the site from the fixture feed
        run: go run ./cmd/tgbus build -feed testdata/feed -out "$RUNNER_TEMP/site" && test -f "$RUNNER_TEMP/site/index.html"
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test web/test/*.test.mjs
