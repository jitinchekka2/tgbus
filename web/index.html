<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Telangana State Road Transport Corporation bus routes, stops and timetables on a map.">
  <meta name="color-scheme" content="light dark">
  <title>TGSRTC bus network</title>
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" role="application" aria-label="Map of the TGSRTC bus network"></div>

  <aside id="panel" aria-label="Route and stop information">
    <header>
      <h1>TGSRTC bus network</h1>
      <p class="muted">Telangana State Road Transport Corporation</p>
    </header>

    <div class="search-box">
      <label for="search" class="sr-only">Search routes and stops</label>
      <input id="search" type="search" placeholder="Search route number or stop…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul id="results" role="listbox" aria-label="Search results" hidden></ul>
    </div>

    <div id="view" aria-live="polite"></div>

    <fieldset id="layers">
      <legend>Layers</legend>
      <label><input type="checkbox" id="toggle-network" checked> All routes</label>
      <label><input type="checkbox" id="toggle-stops" checked> Stops</label>
      <label><input type="checkbox" id="toggle-heat"> Service intensity (trips per stop)</label>
    </fieldset>

    <footer>
      <p id="status" class="muted" role="status">Loading…</p>
      <p class="muted small">
        Schedules are from the published feed and may differ from what runs on the day.
        Data: <a href="https://data.telangana.gov.in/" target="_blank" rel="noopener">Open Data Telangana</a> / TGSRTC.
        Map: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors,
        <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>.
      </p>
      <p id="feed-info" class="muted small"></p>
    </footer>
  </aside>

  <noscript><p class="noscript">This map needs JavaScript.</p></noscript>
  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
